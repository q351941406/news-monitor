name: Failure Notification
on:
  workflow_run:
    workflows:
      - 'Scrape GitHub Trending'
      - 'Scrape Twitter'
      - 'Scrape Producthunt'
      - 'Run Tests'
      - 'Test Notification'
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run;
            const workflowName = workflow.name;
            const runId = workflow.id;
            const branch = workflow.head_branch;
            const conclusion = workflow.conclusion;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const date = new Date(workflow.created_at).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });

            const title = `❌ Workflow Failed: ${workflowName}`;

            // 查找同名的 open Issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-failure'
            });
            const existingIssue = issues.find(i => i.title === title);

            if (conclusion === 'failure') {
              // ====== 失败处理 ======
              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: `**再次失败** - ${date}\n\n- 分支: \`${branch}\`\n- 运行: [${runId}](${runUrl})`
                });
                console.log(`📝 Comment added to existing issue #${existingIssue.number}`);
              } else {
                const { data: newIssue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: `## 🚨 Workflow 运行失败\n\n**Workflow**: ${workflowName}\n**分支**: \`${branch}\`\n**时间**: ${date}\n**运行ID**: ${runId}\n\n[🔗 查看运行详情](${runUrl})\n\n> 此 Issue 由 Failure Notification 自动创建，当对应 workflow 恢复成功后会自动关闭。`,
                  labels: ['automated-failure']
                });
                console.log(`✅ Created issue #${newIssue.number} for ${workflowName} failure`);
              }
            } else if (conclusion === 'success' && existingIssue) {
              // ====== 恢复成功，关闭 Issue ======
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `✅ **已恢复** - ${date}\n\nWorkflow **${workflowName}** 已成功运行。\n\n[🔗 查看运行](${runUrl})`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed'
              });
              console.log(`🎉 Closed issue #${existingIssue.number} - ${workflowName} recovered`);
            }
