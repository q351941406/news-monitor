name: Topic Reaggregate (大扫除)
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source slug (github / producthunt / twitter)'
        required: true
        default: 'github'
        type: choice
        options:
          - github
          - producthunt
          - twitter
permissions:
  contents: read
jobs:
  reaggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/migrate-ci.ts
      - name: Topic reaggregate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: npx tsx scripts/topic-reaggregate.ts --source="${{ inputs.source }}"
      - name: Report failure to Sentry
        if: failure()
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          npx --yes @sentry/cli send-event \
            -m "🚨 Topic reaggregate failed (source ${{ inputs.source }})" \
            --log-level error \
            --fingerprint "news-monitor-reaggregate-${{ inputs.source }}-$(date +%F)"
