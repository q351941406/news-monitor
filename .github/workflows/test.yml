name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check Drizzle migrations consistency
        run: npm run db:check
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Coverage gate
        run: npm run test:coverage:check
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: news_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run db:migrate
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run test:integration
