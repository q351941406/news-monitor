name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Production build (catches build-time failures early)
        env:
          NEXT_PUBLIC_SITE_URL: https://news.myaicode.qzz.io
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check Drizzle migrations consistency
        run: npm run db:check
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: news_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run db:migrate
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run test:integration
      - name: Coverage gate (unit ∪ integration ≥ 80%)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: |
          npm run test:coverage:unit
          npm run test:coverage:integration
          npm run test:coverage:merge
