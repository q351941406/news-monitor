name: Run Tests

on:
  push:
    branches: [main, preview, production]
  pull_request:
    branches: [main, preview, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  # promote 流向守卫：三分支模型的关键 gate。
  # 允许 feature → main（GitHub Flow），但 preview / production 只能按
  # main → preview → production 逐级 promote，禁止跳级或从 feature 直推生产。
  promote-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promote flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD → $BASE"
          case "$BASE" in
            main)
              echo "✅ 目标 main：允许任意 feature 分支（GitHub Flow）"
              ;;
            preview)
              if [ "$HEAD" != "main" ]; then
                echo "::error::只允许从 main promote 到 preview（当前 $HEAD → preview）"
                exit 1
              fi
              echo "✅ 目标 preview：来源 main，合法"
              ;;
            production)
              if [ "$HEAD" != "preview" ]; then
                echo "::error::只允许从 preview promote 到 production（当前 $HEAD → production）。禁止跳级上线。"
                exit 1
              fi
              echo "✅ 目标 production：来源 preview，合法"
              ;;
            *)
              echo "::error::未知目标分支 $BASE"
              exit 1
              ;;
          esac
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Production build (catches build-time failures early)
        env:
          NEXT_PUBLIC_SITE_URL: https://news.myaicode.qzz.io
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # 迁移安全性门禁要与基线做 diff，浅克隆拿不到 merge-base
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check Drizzle migrations consistency
        run: npm run db:check
      - name: Check migration safety (expand-contract gate)
        env:
          # PR 用 base sha；push 到 main 时回落到 origin/main
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: npm run db:check:safety
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: news_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run db:migrate
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run test:integration
      - name: Coverage gate (unit ∪ integration ≥ 80%)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: |
          npm run test:coverage:unit
          npm run test:coverage:integration
          npm run test:coverage:merge
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: news_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
        run: npm run db:migrate:ci
      - name: Production build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (real browser against production build)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/news_monitor_test
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
