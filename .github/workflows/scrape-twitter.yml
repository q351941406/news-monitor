name: Scrape Twitter
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pipeline
        with:
          source: twitter
          source-display-name: Twitter
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
      - name: Auto retry on failure (max 2 attempts)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempts=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.run_attempt')
          if [ "$attempts" -lt 2 ]; then
            echo "Attempt $attempts failed, retrying once in 120s..."
            sleep 120
            gh run rerun ${{ github.run_id }} --failed
          else
            echo "Attempt $attempts failed, giving up (max retries reached)"
          fi

      - name: Report failure to Sentry
        if: failure() && (github.event_name != 'schedule' || github.run_attempt >= 2)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          npx --yes @sentry/cli send-event \
            -m "🚨 ${{ github.workflow }} scrape failed (run #${{ github.run_id }}, attempt ${{ github.run_attempt }}, branch ${{ github.ref_name }})" \
            --log-level error \
            --fingerprint "news-monitor-scrape-twitter-$(date +%F)"
