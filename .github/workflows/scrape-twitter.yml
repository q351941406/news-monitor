name: Scrape Twitter
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scrape-pipeline
        with:
          source: twitter
          source-display-name: Twitter
      - name: Auto retry on failure (max 2 attempts)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempts=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.run_attempt')
          if [ "$attempts" -lt 2 ]; then
            echo "Attempt $attempts failed, retrying once in 120s..."
            sleep 120
            gh run rerun ${{ github.run_id }} --failed
          else
            echo "Attempt $attempts failed, giving up (max retries reached)"
          fi
