name: Scrape News Sources

on:
  schedule:
    # 每 4 小时运行一次
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to scrape (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - github
          - producthunt
          - twitter

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: ${{ fromJson(github.event.inputs.source && format('["{0}"]', github.event.inputs.source) || '["github", "producthunt", "twitter"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
        run: npx tsx scripts/scrape.ts --source=${{ matrix.source }}

      - name: Report
        if: always()
        run: echo "Scrape completed for ${{ matrix.source }}"
