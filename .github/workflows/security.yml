# ============================================================
# Security Scanning
# - Semgrep: 静态代码安全分析 (SAST) - 替代 CodeQL，私有仓库免费
# - Dependency Review: PR 中检查依赖漏洞
# - npm audit: 依赖安全审计
# ============================================================
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC 全量扫描
    - cron: '0 2 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # 上传 SARIF 到 GitHub Security tab
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (native CE)
        # 原生 Semgrep CLI（semgrep-action 已弃用）：
        # --config auto: 安全规则集 + 最佳实践规则
        # --error: 有 blocking 级别发现时退出码非 0，阻断 CI
        run: semgrep scan --config auto --error --sarif-file semgrep.sarif
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true  # GHAS 未启用时静默跳过
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # 仅在 PR 时运行
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 拒绝 high/critical 漏洞
          fail-on-severity: high
          # 拒绝不兼容的许可证
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (production deps only)
        # 报告模式：输出漏洞报告但不阻断 CI
        # 已知遗留：sharp<0.35.0 需等 next 官方更新（tracked in overrides）
        # postcss 已通过 overrides 修复
        run: npm audit --omit=dev --audit-level=high || true
