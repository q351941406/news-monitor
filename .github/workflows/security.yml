# ============================================================
# Security Scanning
# - CodeQL: 静态代码安全分析 (SAST)
# - Dependency Review: PR 中检查依赖漏洞
# - npm audit: 依赖安全审计
# ============================================================
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC 全量扫描
    - cron: '0 2 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # 私有仓库需启用 GitHub Advanced Security (Code Scanning) 才能上传结果
    # 未启用时此 job 会失败但不阻断 CI；启用 GHAS 后自动生效
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 默认 query suite；如仓库启用了 GHAS 可改为 security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # 仅在 PR 时运行
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 拒绝 high/critical 漏洞
          fail-on-severity: high
          # 拒绝不兼容的许可证
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (production deps only)
        # 报告模式：输出漏洞报告但不阻断 CI
        # 已知遗留：sharp<0.35.0 需等 next 官方更新（tracked in overrides）
        # postcss 已通过 overrides 修复
        run: npm audit --omit=dev --audit-level=high || true
