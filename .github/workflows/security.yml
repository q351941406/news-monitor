# ============================================================
# Security Scanning
# - Semgrep: 静态代码安全分析 (SAST) - 替代 CodeQL，私有仓库免费
# - Dependency Review: PR 中检查依赖漏洞
# - npm audit: 依赖安全审计
# ============================================================
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC 全量扫描
    - cron: '0 2 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # 上传 SARIF 到 GitHub Security tab
      actions: read  # Semgrep action 上报 telemetry 需要
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # baseline 对比需要完整 git 历史
          # PR 场景默认 checkout merge commit（refs/pull/N/merge，2 个 parent），
          # 会导致 Semgrep 的 --baseline-commit diff-aware 失效、退化为全量扫描，
          # 进而报告存量 finding、误阻断 PR。这里改为 checkout PR head 提交
          # （单 parent），让 Semgrep 只扫描「本次 PR 变更的文件」。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run Semgrep (native CE)
        # 原生 Semgrep CLI（semgrep-action 已弃用）：
        # --config auto: 安全规则集 + 最佳实践规则
        # --error: 有 blocking 级别发现时退出码非 0，阻断 CI
        # --baseline-commit: 只检查本次变更引入的新问题
        #   - push:    对比上一次提交 (github.event.before)
        #   - PR:      对比目标分支 base
        #   - schedule: 全量扫描，报告模式（存量问题走 Security tab 跟踪，不阻断）
        # github context 通过 env 中转，避免 run 内插值触发 shell-injection 规则
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 解析一个「当前 HEAD 祖先」的基线提交。
          # github.event.before 在 force-push / rebase 时可能已不在历史里，
          # 直接传给 --baseline-commit 会让 semgrep 崩溃（git cat-file 找不到该 commit）。
          # 这里先校验有效性：无效则回退到 HEAD~1；连 HEAD~1 都没有（首个 commit）则不设 baseline 全量扫。
          resolve_baseline() {
            local candidate="$1"
            if [[ -n "$candidate" ]] && git merge-base --is-ancestor "$candidate" HEAD 2>/dev/null; then
              echo "$candidate"
            elif git merge-base --is-ancestor "HEAD~1" HEAD 2>/dev/null; then
              echo "HEAD~1"
            else
              echo ""
            fi
          }
          if [[ "$EVENT_NAME" == "push" ]]; then
            BASELINE="$(resolve_baseline "$BEFORE_SHA")"
            if [[ -n "$BASELINE" ]]; then
              semgrep scan --config auto --error --sarif-output=semgrep.sarif --baseline-commit="$BASELINE"
            else
              semgrep scan --config auto --error --sarif-output=semgrep.sarif
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASELINE="$(resolve_baseline "$PR_BASE_SHA")"
            if [[ -n "$BASELINE" ]]; then
              semgrep scan --config auto --error --sarif-output=semgrep.sarif --baseline-commit="$BASELINE"
            else
              semgrep scan --config auto --error --sarif-output=semgrep.sarif
            fi
          else
            semgrep scan --config auto --sarif-output=semgrep.sarif
          fi
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true  # GHAS 未启用时静默跳过
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # 仅在 PR 时运行
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8
        with:
          # 拒绝 high/critical 漏洞
          fail-on-severity: high
          # 拒绝不兼容的许可证
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (production deps only)
        # 报告模式：输出漏洞报告但不阻断 CI
        # 已知遗留：sharp<0.35.0 需等 next 官方更新（tracked in overrides）
        # postcss 已通过 overrides 修复
        run: npm audit --omit=dev --audit-level=high || true
