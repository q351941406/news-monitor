# ============================================================
# Security Scanning
# - Semgrep: 静态代码安全分析 (SAST) - 替代 CodeQL，私有仓库免费
# - Dependency Review: PR 中检查依赖漏洞
# - npm audit: 依赖安全审计
# ============================================================
name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC 全量扫描
    - cron: '0 2 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          # 使用自动配置：包含安全规则集 + 最佳实践规则
          # 检测 XSS、SQL 注入、密钥泄露、不安全模式等
          config: auto
          # 有 high 级别发现时阻断 CI
          # generate Sarif report for GitHub Security tab (if GHAS enabled later)
          generateSarif: '1'
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # 仅在 PR 时运行
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 拒绝 high/critical 漏洞
          fail-on-severity: high
          # 拒绝不兼容的许可证
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (production deps only)
        # 报告模式：输出漏洞报告但不阻断 CI
        # 已知遗留：sharp<0.35.0 需等 next 官方更新（tracked in overrides）
        # postcss 已通过 overrides 修复
        run: npm audit --omit=dev --audit-level=high || true
