# ============================================================
# News Monitor - 本地开发编排
# 用法:
#   docker compose up -d         # 启动 app + postgres
#   docker compose logs -f app   # 查看 app 日志
#   docker compose down -v       # 停止并清理数据卷
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-monitor-app
    ports:
      - "3000:3000"
    environment:
      # 本地数据库连接（指向下方 db 服务）
      DATABASE_URL: postgresql://news:news_dev_password@db:5432/news_monitor
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # 其他敏感变量应通过 .env 文件注入，不进 git
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      # UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL}
      # UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - news-net
    # 仅在生产 image 跑 healthcheck；本地也能用
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: news-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_monitor
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news_dev_password
    ports:
      - "5432:5432"   # 暴露给宿主机，方便用 psql / GUI 工具调试
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - news-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  news-net:
    driver: bridge

volumes:
  pgdata:
    name: news-monitor-pgdata
